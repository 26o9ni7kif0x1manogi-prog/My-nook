<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#F8F5EE"/>
<title>FAMILY STOCKROOM</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<style>
:root{--bg:#F8F5EE;--surface:#FFF;--surface-alt:#EEF6F1;--ink:#262420;--ink-soft:#74705F;--line:#E2DDCC;--fern:#3F6B4A;--fern-deep:#2E4F37;--amber:#E0900D;--amber-bg:#FFF1D2;--rust:#D8402E;--rust-bg:#FBE0DA;--r:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
#app{max-width:480px;margin:0 auto;overflow-x:hidden;}
header.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);}
.brand{font-family:'Jost',sans-serif;font-weight:300;font-size:1.5rem;letter-spacing:.08em;margin:0;text-transform:uppercase;color:var(--ink);}
.brand-sub{font-family:'Jost',sans-serif;font-weight:400;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--fern-deep);margin:2px 0 0;}
.home-tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;}
.home-tabs::-webkit-scrollbar{display:none;}
.home-tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:.74rem;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.home-tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.alert-strip{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.alert-chip{border:none;cursor:pointer;font-size:.75rem;font-weight:700;padding:6px 10px;border-radius:999px;font-family:inherit;}
.alert-chip.rust{background:var(--rust-bg);color:var(--rust);}
.alert-chip.amber{background:#D0EEF7;color:#1A6E8A;}
.alert-chip.clear{background:var(--surface-alt);color:var(--ink-soft);}
.search-row{margin-top:10px;}
.search-wrap{position:relative;}
#searchInput{width:100%;padding:9px 36px 9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;font-family:inherit;color:var(--ink);}
#searchInput:focus{outline:2px solid var(--fern);outline-offset:1px;}
.search-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:var(--surface-alt);color:var(--ink-soft);font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.chip-row{margin-top:9px;display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch;}
.chip-row::-webkit-scrollbar{display:none;}
.tape-chip{flex:0 0 auto;border:none;cursor:pointer;font-size:.78rem;font-weight:700;color:#fff;padding:6px 13px;border-radius:8px;opacity:.55;font-family:inherit;}
.tape-chip.active{opacity:1;box-shadow:0 2px 0 rgba(0,0,0,.15) inset;}
.tape-chip.all{background:var(--ink-soft);}
.sub-tabs-row{margin-top:7px;display:none;}
.sub-tab-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:.74rem;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;font-family:inherit;}
.sub-tab-chip.active{color:#fff;border-color:transparent;}
main#listArea{padding:13px 14px 0;}
.section-head{display:flex;align-items:center;gap:8px;margin:16px 0 7px;}
.section-tape{font-weight:900;font-size:.9rem;color:#fff;padding:4px 13px 5px;border-radius:6px;}
.section-count{font-size:.76rem;color:var(--ink-soft);}
.sub-head{font-size:.76rem;font-weight:700;color:var(--ink-soft);margin:10px 2px 5px;}
.item-card,.shop-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);padding:9px;margin-bottom:8px;display:flex;gap:9px;align-items:center;cursor:pointer;position:relative;overflow:hidden;}
.item-card:active,.shop-card:active{background:var(--surface-alt);}
.item-tape{position:absolute;top:-6px;left:13px;width:28px;height:11px;border-radius:2px;opacity:.9;}
.item-photo{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--surface-alt);border:1px solid var(--line);}
.item-photo.placeholder{display:flex;align-items:center;justify-content:center;font-size:1rem;}
.item-main{flex:1;min-width:0;}
.item-name{font-weight:700;font-size:.92rem;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-maker{font-size:.72rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.item-badges{font-size:.72rem;color:var(--ink-soft);display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.low-badge{color:var(--rust);font-weight:700;}
.price-badge{color:var(--fern-deep);font-weight:700;}
.stepper-mini{display:flex;align-items:center;gap:5px;margin-top:4px;}
.stepper-mini button{width:25px;height:25px;border-radius:50%;border:1px solid var(--line);background:var(--surface-alt);font-size:.9rem;line-height:1;color:var(--ink);cursor:pointer;}
.stepper-mini .qty{min-width:32px;text-align:center;font-weight:700;font-size:.86rem;}
.ticket{flex:0 0 auto;border-left:2px dashed var(--line);padding-left:8px;text-align:right;position:relative;min-width:54px;max-width:86px;}
.ticket::before,.ticket::after{content:'';position:absolute;left:-6px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:1px solid var(--line);}
.ticket::before{top:-2px;}.ticket::after{bottom:-2px;}
.ticket-cat{font-size:.64rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.ticket .ex-date{font-size:.68rem;color:var(--ink-soft);}
.ticket .ex-status{font-size:.78rem;font-weight:700;}
.ex-status.expired{color:var(--rust);}.ex-status.soon{color:var(--amber);}.ex-status.ok{color:var(--fern-deep);}.ex-status.none{color:var(--line);}
.shop-price-line{font-size:.7rem;color:var(--ink-soft);margin-top:2px;}
.shop-check{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:none;background:var(--fern);color:#fff;font-size:1.1rem;cursor:pointer;}
.empty-state{margin-top:40px;text-align:center;color:var(--ink-soft);padding:28px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);}
.empty-state .emoji{font-size:1.8rem;}
.empty-state .note{font-weight:900;font-size:1rem;color:var(--ink);margin:7px 0 3px;}
.fab-row{position:fixed;right:max(16px,calc(50% - 240px + 16px));bottom:calc(22px + env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center;z-index:25;}
.fab{width:56px;height:56px;border-radius:50%;background:var(--fern);color:#fff;border:3px solid var(--bg);font-size:1.7rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25);flex:0 0 auto;line-height:1;}
.fab:active{background:var(--fern-deep);}
.price-mode-fab{height:42px;border-radius:21px;border:3px solid var(--bg);background:var(--surface);color:var(--fern-deep);font-size:.72rem;font-weight:700;padding:0 13px;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.18);}
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.55);z-index:50;display:none;align-items:flex-end;justify-content:center;overflow:hidden;touch-action:pan-y;}
.overlay.open{display:flex;}
.overlay.center{align-items:center;}
#cropOverlay{z-index:55;}#lightboxOverlay{z-index:56;}
.modal{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;overflow-x:hidden;border-radius:20px 20px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom));touch-action:pan-y;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;}
.modal-head h2{font-weight:900;font-size:1.05rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.modal-head-actions{display:flex;gap:5px;flex:0 0 auto;}
.edit-pill{background:var(--fern);color:#fff;font-size:.78rem;font-weight:700;border:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit;}
.icon-btn{border:none;background:transparent;font-size:1.1rem;color:var(--ink-soft);width:38px;height:38px;border-radius:50%;cursor:pointer;}
.fsec{font-weight:900;font-size:.76rem;color:var(--ink-soft);margin-top:20px;padding-bottom:5px;border-bottom:1px solid var(--line);}
.modal label{display:block;font-size:.78rem;color:var(--ink-soft);margin-top:12px;font-weight:700;}
.modal input[type=text],.modal input[type=number],.modal select{width:100%;margin-top:5px;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.92rem;font-family:inherit;color:var(--ink);min-width:0;}
.modal input[type=date]{width:100%;margin-top:5px;padding:10px 11px;height:43px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;font-family:inherit;color:var(--ink);min-width:0;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;}
.modal input:focus,.modal select:focus{outline:2px solid var(--fern);outline-offset:1px;}
.row-2{display:flex;gap:8px;}
.row-2>label,.row-2>div{flex:1;min-width:0;overflow:hidden;}
.row-2 input[type=date]{font-size:.78rem;padding:9px 5px;height:38px;}
.row-2 select{font-size:.84rem;padding:9px 6px;}
.photo-label{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;width:100%;height:110px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface);cursor:pointer;overflow:hidden;color:var(--ink-soft);font-size:.83rem;margin-top:7px;}
#photoPreview{width:100%;height:100%;object-fit:cover;}
.recrop-btn{margin-top:7px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:.76rem;padding:6px 9px;border-radius:8px;cursor:pointer;width:100%;font-family:inherit;}
.swatch-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;}
.swatch{border:none;color:#fff;font-size:.78rem;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;opacity:.5;font-family:inherit;}
.swatch.selected{opacity:1;box-shadow:0 0 0 2px var(--ink) inset;}
.sub-chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.76rem;padding:5px 11px;border-radius:999px;cursor:pointer;font-family:inherit;}
.icon-selected-preview{width:48px;height:48px;border-radius:11px;border:2px solid var(--fern);background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-top:7px;}
.icon-cat-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.icon-cat-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:.76rem;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer;font-family:inherit;}
.icon-cat-btn.active{background:var(--fern);color:#fff;border-color:var(--fern);}
.icon-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.icon-btn-pick{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn-pick.selected{border-color:var(--fern);box-shadow:0 0 0 2px var(--fern) inset;background:var(--surface-alt);}
.stepper{display:flex;align-items:center;gap:7px;margin-top:5px;}
.stepper button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;cursor:pointer;color:var(--ink);}
.stepper input{flex:1;text-align:center;margin-top:0!important;}
.toggle-group{display:flex;gap:5px;margin-top:5px;}
.toggle-btn{flex:1;border:1px solid var(--line);background:var(--surface);padding:7px;border-radius:8px;font-size:.78rem;cursor:pointer;color:var(--ink);font-family:inherit;}
.toggle-btn.selected{background:var(--fern);color:#fff;border-color:var(--fern);}
.purchase-form{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:9px;}
.sort-bar{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:7px;flex-wrap:wrap;}
.sort-tabs{display:flex;gap:5px;}
.sort-tab{font-size:.76rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-soft);font-family:inherit;}
.sort-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.local-price-toggle{font-size:.72rem;font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid var(--fern);background:var(--surface-alt);color:var(--fern-deep);cursor:pointer;font-family:inherit;white-space:nowrap;}
.purchase-row{display:flex;align-items:flex-start;gap:7px;padding:8px 0;border-bottom:1px solid var(--line);}
.purchase-row .pdate{color:var(--ink-soft);font-size:.7rem;width:44px;flex:0 0 auto;padding-top:2px;}
.purchase-row .pmain{flex:1;min-width:0;}
.purchase-row .pstore{font-weight:700;font-size:.83rem;}
.purchase-row .pprice{font-weight:700;color:var(--fern-deep);font-size:.84rem;}
.purchase-row .pexcl{font-size:.68rem;color:var(--ink-soft);font-weight:400;margin-left:3px;}
.purchase-row .pmemo{font-size:.7rem;color:var(--ink-soft);margin-top:1px;}
.rank-badge{font-size:.66rem;background:var(--amber-bg);color:var(--amber);padding:2px 5px;border-radius:5px;font-weight:700;margin-left:3px;}
.rank-badge.best{background:var(--fern);color:#fff;}
.pdel{border:none;background:transparent;color:var(--ink-soft);font-size:.9rem;cursor:pointer;padding:3px;}
.chart-empty{font-size:.76rem;color:var(--ink-soft);margin-top:9px;}
.price-chart{width:100%;height:86px;margin-top:9px;display:block;}
.show-more-btn{display:block;width:100%;margin-top:7px;background:var(--surface-alt);border:1px solid var(--line);color:var(--ink-soft);font-size:.76rem;font-weight:700;padding:7px;border-radius:9px;cursor:pointer;font-family:inherit;}
.modal-actions{display:flex;gap:9px;margin-top:22px;}
.primary-btn{flex:1;background:var(--fern);color:#fff;border:none;padding:12px;border-radius:11px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;}
.primary-btn:active{background:var(--fern-deep);}
.danger-btn{background:transparent;color:var(--rust);border:1px solid var(--rust-bg);padding:12px 14px;border-radius:11px;font-size:.88rem;cursor:pointer;font-family:inherit;}
.view-photo-wrap{display:flex;justify-content:center;margin-top:3px;}
.view-photo{width:110px;height:110px;border-radius:16px;object-fit:cover;border:1px solid var(--line);}
.view-photo.placeholder{display:flex;align-items:center;justify-content:center;font-size:2.4rem;}
.view-badges{display:flex;gap:5px;justify-content:center;margin-top:9px;flex-wrap:wrap;}
.view-cat-badge{color:#fff;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;}
.view-sub-badge{background:var(--surface-alt);color:var(--ink-soft);font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;}
.view-name{text-align:center;font-size:1.12rem;font-weight:900;margin:7px 0 2px;}
.view-jan{text-align:center;font-size:.72rem;color:var(--ink-soft);font-family:monospace;margin-bottom:3px;}
.view-qty-card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;}
.view-qty-label{font-size:.83rem;font-weight:700;}
.view-info-row{font-size:.82rem;color:var(--ink-soft);margin-top:7px;padding:0 2px;}
.view-info-row .ex-status{font-weight:700;}
.item-memo-box{background:var(--surface-alt);border-radius:9px;padding:8px 10px;font-size:.8rem;color:var(--ink);margin-top:9px;}
.item-memo-box .memo-label{font-size:.68rem;color:var(--ink-soft);font-weight:700;margin-bottom:2px;}
.crop-box{background:var(--bg);border-radius:16px;padding:16px;width:290px;max-width:90vw;text-align:center;}
.crop-box h3{margin:0 0 3px;font-size:.95rem;font-weight:700;}
.crop-box p{margin:0;font-size:.74rem;color:var(--ink-soft);}
.crop-viewport{width:250px;height:250px;margin:12px auto;border-radius:14px;overflow:hidden;position:relative;touch-action:none;background:#111;}
.crop-viewport img{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;}
.crop-actions{display:flex;gap:9px;margin-top:12px;}
.lightbox-box{position:relative;max-width:92vw;max-height:85vh;}
.lightbox-box img{display:block;max-width:92vw;max-height:85vh;border-radius:11px;object-fit:contain;background:#000;}
.lightbox-close{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:.95rem;cursor:pointer;}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 17px;border-radius:999px;font-size:.83rem;z-index:70;white-space:nowrap;}
.loading{text-align:center;padding:55px 18px;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div><h1 class="brand">Family Stockroom</h1><p class="brand-sub">Inventory &amp; Collection</p></div>
    <div id="homeTabs" class="home-tabs"></div>
    <div id="inventoryHeaderExtras">
      <div id="alertStrip" class="alert-strip"></div>
      <div class="search-row"><div class="search-wrap">
        <input id="searchInput" type="search" placeholder="名前・JAN・メーカー・メモで検索"/>
        <button type="button" id="searchClearBtn" class="search-clear">✕</button>
      </div></div>
      <div id="categoryChips" class="chip-row"></div>
      <div id="subCategoryTabs" class="chip-row sub-tabs-row"></div>
    </div>
    <div id="storageHeaderExtras" style="display:none;">
      <div id="storageChips" class="chip-row"></div>
      <div id="storageSubChips" class="chip-row sub-tabs-row"></div>
    </div>
  </header>
  <main id="listArea"><div class="loading">読み込み中…</div></main>
  <div class="fab-row">
    <button id="priceModeToggle" type="button" class="price-mode-fab">税込</button>
    <button id="addBtn" class="fab">+</button>
  </div>
</div>

<div id="viewOverlay" class="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="viewTitle">詳細</h2>
      <div class="modal-head-actions">
        <button type="button" id="viewEditBtn" class="edit-pill">編集</button>
        <button type="button" id="closeViewModal" class="icon-btn">✕</button>
      </div>
    </div>
    <div id="viewBody"></div>
  </div>
</div>

<div id="editOverlay" class="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">追加</h2>
      <button type="button" id="closeEditModal" class="icon-btn">✕</button>
    </div>
    <form id="itemForm">
      <div class="fsec" style="margin-top:4px;">写真</div>
      <label for="photoInput" id="photoLabelWrap" class="photo-label">
        <img id="photoPreview" hidden alt=""/>
        <span id="photoPlaceholder">📷 タップして写真を追加</span>
      </label>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden/>
      <button type="button" id="recropBtn" class="recrop-btn" hidden>✂️ 写真を再調整</button>
      <label>アイコン(写真がない場合に表示)</label>
      <div id="iconSelectedWrap" class="icon-selected-preview">📦</div>
      <div id="iconCatRow" class="icon-cat-row"></div>
      <div id="iconPickPanel" class="icon-grid" hidden></div>
      <div class="fsec">基本情報</div>
      <label for="nameInput">名前</label>
      <input id="nameInput" type="text" required placeholder="例: 明治おいしい牛乳 1L"/>
      <label for="makerInput">メーカー(任意)</label>
      <input id="makerInput" type="text" placeholder="例: 明治"/>
      <label for="janInput">JANコード(任意)</label>
      <input id="janInput" type="text" inputmode="numeric" placeholder="例: 4901234567894"/>
      <label for="itemMemoInput">メモ(任意)</label>
      <input id="itemMemoInput" type="text" placeholder="この商品についてのメモ"/>
      <label for="pdMemoInput">購入日メモ</label>
      <input id="pdMemoInput" type="date"/>
      <label>大分類</label>
      <div id="mainSwatches" class="swatch-row"></div>
      <label>中分類</label>
      <div id="subSwatches" class="swatch-row"></div>
      <div class="fsec">保管場所</div>

function todayStr(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function expSt(item){
  if(!item.expirationDate)return{level:'none',text:'期限なし',label:''};
  const t=new Date();t.setHours(0,0,0,0);const e=new Date(item.expirationDate+'T00:00:00');
  const d=Math.round((e-t)/86400000);const md=item.expirationDate.slice(5).replace('-','/');
  if(d<0)return{level:'expired',text:'期限切れ',label:md};
  if(d===0)return{level:'expired',text:'本日まで',label:md};
  if(d<=3)return{level:'soon',text:'残り'+d+'日',label:md};
  return{level:'ok',text:md,label:md};
}
function isLow(item){return Number(item.quantity)<=Number(item.threshold||0);}
function tIncl(p){const r=p.taxRate/100;return p.taxType==='incl'?Math.round(p.price):Math.round(p.price*(1+r));}
function tExcl(p){const r=p.taxRate/100;return p.taxType==='excl'?Math.round(p.price):Math.round(p.price/(1+r));}
function pTot(p,m){return m==='excl'?tExcl(p):tIncl(p);}
function pAmt(p){return Number(p.amount)>0?Number(p.amount):1;}
function pBas(p){return Number(p.priceBasis)>0?Number(p.priceBasis):1;}
function pUnit(p,m){return(pTot(p,m)/pAmt(p))*pBas(p);}
function fy(v){if(!isFinite(v))return'0';return v<10?v.toFixed(1):String(Math.round(v));}
function pBadge(p,m){const tot=pTot(p,m),amt=pAmt(p),unit=p.amountUnit||'',basis=pBas(p);const bl=(basis>1?basis:'')+unit;return'¥'+fy(pUnit(p,m))+'/'+(bl||'回')+'('+amt+unit+' ¥'+tot+')';}
function cheapest(item){if(!item.purchases||!item.purchases.length)return null;return item.purchases.reduce((a,b)=>pUnit(a,state.priceMode)<=pUnit(b,state.priceMode)?a:b);}

function renderAlertStrip(){

function applyFilters(list){
  let out=list;
  const q=state.search.trim().toLowerCase();
  if(q)out=out.filter(i=>[i.name,i.jan||'',i.memo||'',i.maker||'',...(i.purchases||[]).map(p=>p.memo||'')].some(s=>s.toLowerCase().includes(q)));
  if(state.category!=='all')out=out.filter(i=>i.categoryMain===state.category);
  if(state.category!=='all'&&state.subCategory!=='all')out=out.filter(i=>i.categorySub===state.subCategory);
  if(state.quickFilter==='expired')out=out.filter(i=>expSt(i).level==='expired');
  if(state.quickFilter==='soon')out=out.filter(i=>expSt(i).level==='soon');
  if(state.quickFilter==='low')out=out.filter(isLow);
  if(state.quickFilter==='__clear__')state.quickFilter='all';
  return out;
}
function sortByExp(list){
  return[...list].sort((a,b)=>{
    const da=a.expirationDate?new Date(a.expirationDate):null,db=b.expirationDate?new Date(b.expirationDate):null;
    if(da&&db)return da-db;if(da)return-1;if(db)return 1;return a.name.localeCompare(b.name,'ja');
  });
}

  let html='';

function renderStorageList(){

function buildChart(purchases){
  if(!purchases||purchases.length<2)return'<p class="chart-empty">購入記録が2件以上になると単価推移グラフを表示します</p>';
  const sorted=[...purchases].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const prices=sorted.map(p=>pUnit(p,vSecMode));
  const mn=Math.min(...prices),mx=Math.max(...prices),w=270,h=84,pd=13,rng=(mx-mn)||1;
  const xS=sorted.length>1?(w-2*pd)/(sorted.length-1):0;
  const pts=prices.map((p,i)=>[pd+i*xS,h-pd-((p-mn)/rng)*(h-2*pd)]);
  return'<svg viewBox="0 0 '+w+' '+h+'" class="price-chart"><polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#3F6B4A" stroke-width="2"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#3F6B4A"></circle>').join('')+'<text x="'+pd+'" y="11" font-size="9" fill="#74705F">¥'+fy(mx)+'</text><text x="'+pd+'" y="'+(h-3)+'" font-size="9" fill="#74705F">¥'+fy(mn)+'</text></svg>';
}

  document.querySelectorAll('#rTaxRateToggle .toggle-btn').forEach(b=>b.classList.toggle('selected',b.dataset.val==='8'));
  document.querySelectorAll('#rBasisToggle .toggle-btn').forEach(b=>b.classList.toggle('selected',b.dataset.val==='1'));

}
function closeRestock(){restockOverlay.classList.remove('open');rId=null;}

restockOverlay.addEventListener('click',e=>{if(e.target===restockOverlay)closeRestock();});
document.getElementById('rAddQtyMinus').addEventListener('click',()=>{const el=document.getElementById('rAddQty');el.value=Math.max(0,Number(el.value||0)-1);});
document.getElementById('rAddQtyPlus').addEventListener('click',()=>{const el=document.getElementById('rAddQty');el.value=Number(el.value||0)+1;});
document.querySelectorAll('#rTaxTypeToggle .toggle-btn').forEach(b=>b.addEventListener('click',()=>{rTaxType=b.dataset.val;document.querySelectorAll('#rTaxTypeToggle .toggle-btn').forEach(x=>x.classList.toggle('selected',x===b));}));
document.querySelectorAll('#rTaxRateToggle .toggle-btn').forEach(b=>b.addEventListener('click',()=>{rTaxRate=Number(b.dataset.val);document.querySelectorAll('#rTaxRateToggle .toggle-btn').forEach(x=>x.classList.toggle('selected',x===b));}));
document.querySelectorAll('#rBasisToggle .toggle-btn').forEach(b=>b.addEventListener('click',()=>{rBasis=Number(b.dataset.val);document.querySelectorAll('#rBasisToggle .toggle-btn').forEach(x=>x.classList.toggle('selected',x===b));}));
document.getElementById('restockSubmitBtn').addEventListener('click',async()=>{
  const item=items.find(i=>i.id===rId);if(!item)return;
  const price=Number(document.getElementById('rPrice').value);
  if(!price){showToast('価格を入力してください');return;}
  const addQ=Number(document.getElementById('rAddQty').value||0);
  const amount=Number(document.getElementById('rAmount').value)||1;
  const amountUnit=document.getElementById('rAmountUnit').value;
  if(!item.purchases)item.purchases=[];
  item.purchases.push({id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),date:todayStr(),store:document.getElementById('rStore').value.trim(),price,taxType:rTaxType,taxRate:rTaxRate,amount,amountUnit,priceBasis:rBasis,memo:document.getElementById('rMemo').value.trim()});
  const exp=document.getElementById('rExpiry').value;if(exp)item.expirationDate=exp;
  item.quantity=Number(item.quantity)+addQ;

function openSpotAdd(){['spotName','spotStore','spotPrice','spotMemo'].forEach(k=>document.getElementById(k).value='');spotAddOverlay.classList.add('open');}
function closeSpotAdd(){spotAddOverlay.classList.remove('open');}
document.getElementById('closeSpotAddModal').addEventListener('click',closeSpotAdd);
spotAddOverlay.addEventListener('click',e=>{if(e.target===spotAddOverlay)closeSpotAdd();});
document.getElementById('spotAddSubmitBtn').addEventListener('click',async()=>{
  const name=document.getElementById('spotName').value.trim();if(!name){showToast('商品名を入力してください');return;}
  extras.push({id:'spot_'+Date.now(),name,store:document.getElementById('spotStore').value.trim(),price:document.getElementById('spotPrice').value.trim(),memo:document.getElementById('spotMemo').value.trim(),createdAt:Date.now()});
  await saveExtras();closeSpotAdd();renderAll();showToast('買い物リストに追加しました');
});

function renderIconPicker(){
  const prev=document.getElementById('iconSelectedWrap');if(prev)prev.textContent=selIcon;
  const catRow=document.getElementById('iconCatRow');if(!catRow)return;
  catRow.innerHTML=ICON_SETS.map(s=>'<button type="button" class="icon-cat-btn'+(iconCatOpen===s.id?' active':'')+'" data-cat="'+s.id+'">'+s.label+'</button>').join('');
  catRow.querySelectorAll('.icon-cat-btn').forEach(b=>b.addEventListener('click',()=>{iconCatOpen=iconCatOpen===b.dataset.cat?null:b.dataset.cat;renderIconPicker();}));
  const panel=document.getElementById('iconPickPanel');if(!panel)return;
  if(iconCatOpen){
    const set=ICON_SETS.find(s=>s.id===iconCatOpen);panel.hidden=false;
    panel.innerHTML=set.icons.map(e=>'<button type="button" class="icon-btn-pick'+(selIcon===e?' selected':'')+'">'+e+'</button>').join('');
    panel.querySelectorAll('.icon-btn-pick').forEach(b=>b.addEventListener('click',()=>{selIcon=b.textContent.trim();renderIconPicker();}));
  }else{panel.hidden=true;panel.innerHTML='';}
}
function renderMainSwatches(){
  document.getElementById('mainSwatches').innerHTML='';
  CATEGORY_TREE.forEach(m=>{
    const b=document.createElement('button');b.type='button';b.className='swatch'+(selMain===m.id?' selected':'');
    b.style.background=m.color;b.textContent=m.label;
    b.onclick=()=>{selMain=m.id;selSub=m.subs[0].id;selIcon=SUB_ICON[selSub]||'📦';iconCatOpen=null;renderMainSwatches();renderSubSwatches();renderIconPicker();};
    document.getElementById('mainSwatches').appendChild(b);
  });
}
function renderSubSwatches(){
  document.getElementById('subSwatches').innerHTML='';
  const m=mainCat(selMain);
  m.subs.forEach(s=>{
    const b=document.createElement('button');b.type='button';b.className='sub-chip'+(selSub===s.id?' selected':'');
    if(selSub===s.id){b.style.background=m.color;b.style.borderColor=m.color;b.style.color='#fff';}
    b.textContent=s.label;
    b.onclick=()=>{selSub=s.id;selIcon=SUB_ICON[selSub]||'📦';iconCatOpen=null;renderSubSwatches();renderIconPicker();};
    document.getElementById('subSwatches').appendChild(b);
  });
}
function buildStorageDrop(sel){
  storageInput.innerHTML='<option value="">未設定</option>'+STORAGE_FLAT.map(s=>'<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+s.label+'</option>').join('');
  storageCustomInput.hidden=sel!=='custom';
}
storageInput.addEventListener('change',()=>{storageCustomInput.hidden=storageInput.value!=='custom';});
function buildThresholdSel(val){
  const n=Number(val||0);
  thresholdInput.innerHTML=THRESHOLD_OPTIONS.map(o=>'<option value="'+o.v+'"'+(Math.abs(o.v-n)<0.001?' selected':'')+'>'+o.l+'</option>').join('');
}
function openEdit(id){
  editingId=id||null;pendingPhoto=null;iconCatOpen=null;
  itemForm.reset();photoPreview.hidden=true;photoPlaceholder.hidden=false;recropBtn.hidden=true;
  deleteBtn.hidden=!editingId;
  // Reset delete button state
  deletePending=false;clearTimeout(deletePendingTimer);
  deleteBtn.textContent='削除';deleteBtn.style.cssText='';
  let curUnit='個';
  if(editingId){
    const item=items.find(i=>i.id===editingId);
    modalTitle.textContent='編集';
    nameInput.value=item.name;makerInput.value=item.maker||'';janInput.value=item.jan||'';
    itemMemoInput.value=item.memo||'';pdMemoInput.value=item.pdMemo||'';
    selMain=item.categoryMain;selSub=item.categorySub;selIcon=item.icon||SUB_ICON[selSub]||'📦';
    qtyInput.value=item.quantity;curUnit=item.unit||'個';
    buildThresholdSel(item.threshold||0);expInput.value=item.expirationDate||'';
    buildStorageDrop(item.storageId||'');storageCustomInput.value=item.storageCustom||'';
    if(item.photo){pendingPhoto=item.photo;photoPreview.src=item.photo;photoPreview.hidden=false;photoPlaceholder.hidden=true;recropBtn.hidden=false;}
  }else{
    modalTitle.textContent='追加';
    selMain=CATEGORY_TREE[0].id;selSub=CATEGORY_TREE[0].subs[0].id;selIcon=SUB_ICON[selSub]||'📦';
    qtyInput.value=1;buildThresholdSel(1);expInput.value='';buildStorageDrop('');pdMemoInput.value='';
  }
  unitInput.innerHTML=UNIT_OPTIONS.map(u=>'<option value="'+u+'"'+(u===curUnit?' selected':'')+'>'+u+'</option>').join('');
  renderMainSwatches();renderSubSwatches();renderIconPicker();
  editOverlay.classList.add('open');
}
function closeEdit(){editOverlay.classList.remove('open');editingId=null;deletePending=false;clearTimeout(deletePendingTimer);}
document.getElementById('addBtn').addEventListener('click',()=>openEdit(null));
document.getElementById('closeEditModal').addEventListener('click',closeEdit);
editOverlay.addEventListener('click',e=>{if(e.target===editOverlay)closeEdit();});
document.getElementById('qtyMinus').addEventListener('click',()=>{qtyInput.value=Math.max(0,Number(qtyInput.value||0)-1);});
document.getElementById('qtyPlus').addEventListener('click',()=>{qtyInput.value=Number(qtyInput.value||0)+1;});

itemForm.addEventListener('submit',async e=>{
  e.preventDefault();const name=nameInput.value.trim();if(!name)return;
  const prevP=editingId?(items.find(i=>i.id===editingId).purchases||[]):[];
  const sid=storageInput.value;
  const payload={
    id:editingId||('item_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),
    name,maker:makerInput.value.trim()||'',jan:janInput.value.trim()||null,
    memo:itemMemoInput.value.trim()||'',pdMemo:pdMemoInput.value||'',
    categoryMain:selMain,categorySub:selSub,icon:selIcon,
    quantity:Number(qtyInput.value||0),unit:unitInput.value||'個',
    threshold:Number(thresholdInput.value||0),expirationDate:expInput.value||null,
    storageId:sid||'',storageCustom:sid==='custom'?storageCustomInput.value.trim():'',
    photo:pendingPhoto||null,purchases:prevP,updatedAt:Date.now(),
  };
  if(editingId){items[items.findIndex(i=>i.id===editingId)]=payload;}else{items.push(payload);}
  await saveItems();closeEdit();renderAll();openView(payload.id);showToast('保存しました');
});

// 2-step delete
let deletePending=false,deletePendingTimer=null;
deleteBtn.addEventListener('click',async()=>{
  if(!editingId)return;
  if(!deletePending){
    deletePending=true;
    deleteBtn.textContent='確認：本当に削除';
    deleteBtn.style.cssText='color:#fff;background:var(--rust);border:none;';
    clearTimeout(deletePendingTimer);
    deletePendingTimer=setTimeout(()=>{
      deletePending=false;
      deleteBtn.textContent='削除';
      deleteBtn.style.cssText='';
    },3000);
    return;
  }
  clearTimeout(deletePendingTimer);
  deletePending=false;
  const id=editingId;
  items=items.filter(i=>i.id!==id);
  await saveItems();closeEdit();renderAll();showToast('削除しました');
});

// Crop
const CVS=250;let cropData=null,cropDrag=null;
function openCropper(src){
  const img=new Image();
  img.onload=()=>{
    const bS=CVS/Math.min(img.naturalWidth,img.naturalHeight);
    cropData={iw:img.naturalWidth,ih:img.naturalHeight,baseScale:bS,scale:bS,tx:(CVS-img.naturalWidth*bS)/2,ty:(CVS-img.naturalHeight*bS)/2};
    cropImg.src=src;cropZoom.value=1;applyC();cropOverlay.classList.add('open');
  };img.src=src;
}
function applyC(){cropImg.style.width=(cropData.iw*cropData.scale)+'px';cropImg.style.height=(cropData.ih*cropData.scale)+'px';cropImg.style.transform='translate('+cropData.tx+'px,'+cropData.ty+'px)';}
function clampC(){const mx=CVS-cropData.iw*cropData.scale,my=CVS-cropData.ih*cropData.scale;cropData.tx=Math.min(0,Math.max(mx,cropData.tx));cropData.ty=Math.min(0,Math.max(my,cropData.ty));}
cropZoom.addEventListener('input',()=>{const v=Number(cropZoom.value),cx=CVS/2,cy=CVS/2,ix=(cx-cropData.tx)/cropData.scale,iy=(cy-cropData.ty)/cropData.scale;cropData.scale=cropData.baseScale*v;cropData.tx=cx-ix*cropData.scale;cropData.ty=cy-iy*cropData.scale;clampC();applyC();});
cropViewport.addEventListener('pointerdown',e=>{cropDrag={sx:e.clientX,sy:e.clientY,stx:cropData.tx,sty:cropData.ty};cropViewport.setPointerCapture(e.pointerId);});
cropViewport.addEventListener('pointermove',e=>{if(!cropDrag)return;cropData.tx=cropDrag.stx+(e.clientX-cropDrag.sx);cropData.ty=cropDrag.sty+(e.clientY-cropDrag.sy);clampC();applyC();});
['pointerup','pointercancel'].forEach(ev=>cropViewport.addEventListener(ev,()=>cropDrag=null));
document.getElementById('cropCancel').addEventListener('click',()=>{cropOverlay.classList.remove('open');photoInput.value='';});
document.getElementById('cropConfirm').addEventListener('click',()=>{
  const c=document.createElement('canvas');c.width=480;c.height=480;
  c.getContext('2d').drawImage(cropImg,-cropData.tx/cropData.scale,-cropData.ty/cropData.scale,CVS/cropData.scale,CVS/cropData.scale,0,0,480,480);
  pendingPhoto=c.toDataURL('image/jpeg',0.72);
  photoPreview.src=pendingPhoto;photoPreview.hidden=false;photoPlaceholder.hidden=true;recropBtn.hidden=false;cropOverlay.classList.remove('open');
});
photoInput.addEventListener('change',()=>{const f=photoInput.files[0];if(!f)return;const r=new FileReader();r.onload=e=>openCropper(e.target.result);r.readAsDataURL(f);});
recropBtn.addEventListener('click',()=>{if(pendingPhoto)openCropper(pendingPhoto);});

searchInput.addEventListener('input',()=>{state.search=searchInput.value;renderList();});
document.getElementById('searchClearBtn').addEventListener('click',()=>{searchInput.value='';state.search='';renderList();searchInput.focus();});

(async function init(){
  renderHomeTabs();await loadItems();await loadExtras();renderAll();
})();
})();
</script>
